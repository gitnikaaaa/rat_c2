name: C2 BOT - Постоянный обработчик команд

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout репозиторий
        uses: actions/checkout@v4
      
      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Установка зависимостей
        run: |
          pip install requests PyGithub
      
      - name: Запуск C2 бота
        env:
          # ✅ ПРАВИЛЬНО - используем имя секрета без GITHUB_
          C2_TOKEN: ${{ secrets.C2_TOKEN }}
          C2_USER: ${{ github.repository_owner }}
          C2_REPO: ${{ github.event.repository.name }}
        run: |
          python c2_bot.py
